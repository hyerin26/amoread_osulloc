<html lang="ko">
<head>

<!-- 디자인 기준: AMOREAD Green UI v2.5.1. 색·글자·간격은 앱의 tokens.css를 그대로 읽는다 -->

<link rel="preload" href="/static/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
<header class="v2top v2one" aria-label="기획안 막대">
  <a class="v2logo" href="/v2/home" aria-label="AMOREAD 홈"><i aria-hidden="true">a</i>AMOREAD</a>
  <a class="v2ident" href="/v2/home" title="기획안 목록으로">봄 · 피크닉에서 누리는 차 한 잔의 여유</a>
  <nav class="v2steps" aria-label="단계"><a href="/v2/brief" aria-current="step">01 브리프</a><a href="/v2/compose">02 구좌 구성</a><a href="/v2/editor">03 구좌 편집</a><a href="/v2/preview">04 미리보기·내보내기</a></nav>
  <a class="v2space" href="/v2/deals">상품·할인</a>
  <span class="v2saved" id="v2saved" aria-live="polite"></span>
  <span class="v2grow"></span>
  <a class="v2btn primary v2next" href="/v2/compose">다음: 구좌 구성<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  <a class="v2tool" href="/v2/library" aria-label="레퍼런스 라이브러리" title="레퍼런스 라이브러리"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M6 21h13v-3"/><path d="M9 7h6"/></svg></a>
  <a class="v2tool" href="/v2/inspire" aria-label="오늘의 영감" title="오늘의 영감"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.2 1.1 2V16h5v-.2c0-.8.5-1.5 1.1-2A6 6 0 0 0 12 3z"/></svg></a>
  <a class="v2gear" href="/v2/settings" aria-label="설정·데이터"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></a>
</header>

<main class="page">
  <p class="demo">명분에서 키워드를 펼치고, 검색 흐름·관련 글·연결 상품을 확인해 브리프에 담으세요. 콘텐츠에서 함께 나온 말과 검색 상승 신호는 구분해서 표시해요.</p>

  <div class="masthead">
    <div class="grow">
      <label><span class="cap" hidden>기획안 이름</span><input class="title-in" id="title" maxlength="80" aria-label="기획안 이름"></label>
      <div class="facts">
        <button class="fact cls" data-edit="분류">시즌</button>
        <button class="fact" data-edit="명분"><span class="k">명분</span><span id="rootName">봄</span></button>
        <button class="fact" data-edit="기간"><span class="k">기간</span>3/2(월) ~ 3/15(일)</button>
        <button class="fact" data-edit="페이지"><span class="k">페이지</span>이벤트</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <section class="card" aria-labelledby="mapH">
      <div class="sec-head">
        <h2 id="mapH">키워드 펼치기</h2>
        <span class="tag demo-t" id="mapDemo">근거 기반 탐색</span>
        <span class="grow"></span>
        <button class="btn sm" id="aiKeywordExpand" type="button" disabled aria-describedby="aiKeywordCost" title="약 1분 걸려요 · 누를 때만 AI를 써요">AI로 더 찾기</button><span class="tag ai-cost" id="aiKeywordCost">약 1분</span>
        <button class="btn sm" id="resetBtn">처음 모양으로</button>
      </div>
      <p id="researchStatus" class="cap" role="status"></p>
      <div class="filters" role="group" aria-label="키워드 출처 필터">
        <span class="cap">출처</span>
        <span id="chFilters"></span>
        <button class="btn sm" id="chClear" hidden>전체 보기</button>
        <span class="cap conn"><span id="connTxt">연결 상태 확인 중…</span> <button class="lnk" id="connBtn">연결 설정 보기</button></span>
      </div>
      <nav class="path" id="path" aria-label="지나온 길"></nav>
      <p id="aiKeywordStatus" class="cap map-status" role="status" hidden></p>
      <div class="map-scroll"><svg class="map" id="map" viewBox="0 0 1100 640" role="group" aria-label="키워드 마인드맵. 키워드를 누르면 오른쪽에 근거가 나오고, 동그라미를 누르면 브리프에 담겨요. 연필로 명분을 고쳐요."></svg><div class="map-tip" id="mapTip" role="tooltip" hidden></div><div class="map-empty-box" id="mapEmpty" hidden><p id="mapEmptyMsg"></p><button class="btn sm" type="button" data-ai-more>AI로 더 찾기</button><span class="tag ai-cost">약 1분</span></div></div>
      <div id="mapPagination" class="map-pagination"></div>
      <form id="manualForm" class="research-controls"><input type="text" id="manualKeyword" maxlength="20" aria-label="직접 추가할 키워드" placeholder="찾는 말이 없다면 직접 추가"><button class="btn sm" type="submit">키워드 추가</button></form>
      <div id="hiddenKeywords" class="cap"></div>
    </section>

    <aside class="card side" id="side" aria-live="polite"></aside>
  </div>

  <section class="card sum" aria-labelledby="sumH">
    <div class="sec-head"><h2 id="sumH">정리</h2></div>
    <div class="rows">
      <span class="rl" id="pickedL">고른 키워드</span>
      <div class="pickbar" id="picked" aria-labelledby="pickedL"></div>
      <span class="rl">콘셉트 후보</span>
      <div><div class="sugbar"><button class="btn sm" id="conceptIdeas" type="button">키워드로 콘셉트 조합</button><button class="btn sm" id="aiConceptIdeas" type="button">AI 콘셉트 제안</button></div><div id="conceptCandidates" class="sugs" aria-live="polite"></div></div>
      <label class="rl" for="concept">컨셉 한 줄</label>
      <input type="text" id="concept" maxlength="120" placeholder="예) 피크닉에서 누리는 차 한 잔의 여유">
      <label class="rl" for="who">누구에게, 어떤 때 <em>(선택)</em></label>
      <input type="text" id="who" maxlength="120" placeholder="예) 주말 한강 피크닉을 준비하는 20~30대">
      <label class="rl" for="copy">메인 카피 <em>(선택)</em></label>
      <div>
        <input type="text" id="copy" maxlength="60" placeholder="페이지 첫 화면의 한 줄 · 나중에 써도 돼요">
        <div class="sugbar"><span class="cap">제안</span><span class="tag" title="고른 키워드를 장면형, 질문형 같은 카피 틀에 넣어 만든 문장이에요. 골라서 다듬어 쓰세요.">키워드로 만든 카피 틀</span><span class="cap" id="sugBasis"></span></div>
        <div id="briefAiRecommendations"></div>
        <div class="sugs" id="sugs" role="group" aria-label="메인 카피 제안"></div>
        <div class="sugbar"><button class="btn sm" id="moreSug">다른 제안 보기</button><button class="btn sm" id="aiSug">AI 제안</button>
          </div>
      </div>
      <span class="rl" id="moodL">느낌 레퍼런스 <em>(선택)</em></span>
      <div aria-labelledby="moodL">
        <div class="sugbar"><span class="tag demo-t" id="moodSrcTag">예시</span><span class="cap" id="moodBasis"></span></div>
        <div class="moods" id="moods"></div>
        <div id="moodPicked"></div>
        <div class="sugbar"><label class="btn sm">파일 첨부<input type="file" id="moodFile" accept="image/*,.pdf" hidden></label><button class="btn sm" id="moodLinkBtn" aria-expanded="false">링크 붙이기</button><button class="btn sm ghost" id="moodLib">라이브러리에서 더 보기 (새 탭)</button>
          </div>
        <div class="sugbar" id="moodLinkRow" hidden><input type="text" id="moodUrl" placeholder="https://… (핀터레스트·외부 페이지 등)" aria-label="참고한 링크"><button class="btn sm primary" id="moodUrlAdd">붙이기</button></div>
        
      </div>
    </div>
    <div class="foot"><span class="cap" id="footNote"></span><button class="btn primary" id="nextBtn">구좌 구성 추천 받기 →</button></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<div class="v2scrim" id="refScrim" hidden></div>
<aside class="v2drawer" id="refDrawer" hidden role="dialog" aria-modal="false" aria-labelledby="rdH"></aside>
<script src="/static/v2/shell.js"></script>
<script src="/static/v2/api.js"></script>
<script src="/static/v2/plan.js"></script>
<script src="/copy-recommender-assets/core.js"></script>
<script src="/copy-recommender-assets/editor-plugin.js"></script>
<script src="/static/v2/brief-keywords.js"></script>
<script src="/static/v2/brief.js"></script>
<script src="/copy-recommender-assets/brief-plugin.js"></script>
</body>
</html>
