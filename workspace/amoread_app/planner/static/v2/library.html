<main class="page">
  <p class="demo"><b>직접 추가한 레퍼런스, Pinterest 보드, 즐겨찾기는 실제로 저장돼요</b> (이 PC의 프로그램 폴더). '예시' 표시가 붙은 카드는 가상의 자리예요(이름 일부만 자사몰 보관 페이지에서 빌림). Pinterest 핀 이미지는 저장하지 않고 볼 때 받아 와요.</p>
  <div class="head"><div class="grow"><h1>레퍼런스 라이브러리</h1>
    <p>지난 자사몰 페이지와 외부 사례를 모아 둔 곳이에요. 추천 없이도 둘러볼 수 있고, 필터를 안 고르면 전체가 보여요.</p></div>
