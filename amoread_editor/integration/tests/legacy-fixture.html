<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>기존 편집기 보존 테스트</title>
<style>
:root{--accent:#1b6a94;--accent-ink:white;--accent-soft:#e4eef5;--surface:white;--ink:#17212a;--line:#8da3b6;--r2:10px;--s2:10px}
body{font:15px/1.5 Arial,sans-serif;margin:40px;color:var(--ink)}
.host-toolbar{display:flex;gap:12px;align-items:center}
.host-primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:var(--r2);padding:10px 16px}
.host-secondary{background:#fff;color:var(--accent);border:1px solid var(--line);border-radius:var(--r2);padding:10px 16px}
.host-field{padding:10px;border:1px solid var(--line);border-radius:var(--r2)}
</style>
<script>
window.AMOREAD_INTEGRATION={
 mountSelector:'.host-toolbar',
 buttonLabel:'구좌편집기 · 신규',
 greenUI:{
   selectors:{
    primaryButton:'.host-primary',
    secondaryButton:'.host-secondary',
    input:'.host-field',
    heading:'#legacy-title'
   }
 }
};
</script>
<script defer src="../launcher.js"></script>
</head><body>
<h1 id="legacy-title">기존 구좌편집기 (삭제되면 안 됨)</h1>
<div class="host-toolbar">
<button class="host-primary">기존 편집기 저장</button>
<button class="host-secondary">기존 편집기 미리보기</button>
<input class="host-field" aria-label="기존 편집 입력" value="기존 데이터"/>
</div>
<p id="old-editor-content">기존 구좌편집기 화면은 그대로 남아 있어야 합니다.</p>
</body></html>
