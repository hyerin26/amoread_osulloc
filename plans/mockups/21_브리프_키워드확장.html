<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>브리프 키워드 목업</title>
<!-- 디자인 기준: AMOREAD Green UI v2.5.1. 색·글자·간격은 앱의 tokens.css를 그대로 읽는다 -->
<link rel="stylesheet" href="../../workspace/amoread_app/planner/static/tokens.css">
<style>
@font-face { font-family: 'Pretendard Variable'; font-weight: 45 920; font-display: swap;
  src: url('../../workspace/amoread_app/planner/static/fonts/PretendardVariable.woff2') format('woff2-variations'); }
/* 분류 색은 홈 목업과 같은 [제안] 값 */
:root { --cls-season: #e2f0ee; --cls-season-ink: #1f5f57; }

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); color: var(--ink); background: var(--bg); }
button, input { font: inherit; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.hidden { display: none !important; }
.cap { font-size: var(--fs-cap); line-height: var(--lh-cap); color: var(--mute); }

.top { height: 72px; display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s5); background: var(--shell); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 10px; font-weight: var(--fw-title); font-size: var(--fs-h1); letter-spacing: -0.01em; }
.logo i { width: 32px; height: 32px; border-radius: var(--r2); background: var(--ink); color: var(--surface); display: grid; place-items: center; font-style: normal; font-size: var(--fs-h1); }
.crumb { color: var(--mute); font-size: var(--fs-sm); }
.crumb a { color: var(--mute); text-decoration: none; }
.crumb a:hover { color: var(--ink); }
.top .grow { flex: 1; }
.top .note { color: var(--mute); font-size: var(--fs-cap); }

.page { max-width: 1280px; margin: 0 auto; padding: var(--s6) var(--s5) 160px; }
.demo { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 12px 16px; font-size: var(--fs-sm); line-height: var(--lh-label); margin-bottom: var(--s5); }
.demo b { font-weight: var(--fw-strong); }

/* 페이지 머리: 기획안 이름 + 홈에서 정한 것 (누르면 고침) */
.masthead { display: flex; align-items: flex-end; gap: var(--s4); margin-bottom: var(--s5); flex-wrap: wrap; }
.masthead .grow { flex: 1; min-width: 320px; }
.overline { font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: var(--fw-medium); color: var(--mute); margin-bottom: 4px; }
.title-in { all: unset; display: block; width: 100%; font-size: var(--fs-masthead); line-height: var(--lh-masthead); font-weight: var(--fw-title); letter-spacing: -0.02em; border-radius: var(--r2); }
.title-in:hover { box-shadow: 0 0 0 1px var(--line-strong); }
.title-in:focus { box-shadow: 0 0 0 2px var(--accent); }
.facts { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s3); }
.fact { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; height: var(--control-sm); padding: 0 10px; border-radius: var(--r2); background: var(--sunken); font-size: var(--fs-sm); }
.fact .k { color: var(--mute); }
.fact:hover { background: var(--line-sub); }
.fact.cls { background: var(--cls-season); color: var(--cls-season-ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--control-lg); padding: 0 16px; border: 0; border-radius: var(--r2);
  background: var(--sunken); color: var(--ink); font-weight: var(--fw-strong); line-height: var(--lh-label); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--line-sub); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(.94); }
.btn.sm { height: var(--control-md); padding: 0 12px; font-size: var(--fs-sm); }
.btn:disabled { background: var(--sunken); color: var(--mute); cursor: default; filter: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--line-sub); border-radius: var(--r2); background: var(--surface);
  color: var(--ink2); font-size: var(--fs-cap); font-weight: var(--fw-medium); cursor: pointer; }
.chip:hover { border-color: var(--line-strong); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--sel-line); color: var(--accent); font-weight: var(--fw-strong); }
.tag { display: inline-flex; align-items: center; border-radius: var(--r2); padding: 2px 8px; font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: var(--fw-medium); background: var(--sunken); color: var(--ink2); white-space: nowrap; }
.tag.demo-t { background: var(--warn-soft); color: var(--warn); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s5); align-items: start; }
@media (max-width: 1040px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line-sub); border-radius: var(--r); padding: var(--s-card); }
.sec-head { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; margin-bottom: var(--s3); }
.sec-head h2 { font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: var(--fw-strong); letter-spacing: -0.01em; }
.sec-head .grow { flex: 1; }
.filters { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; margin-bottom: var(--s3); }
.path { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: var(--fs-sm); margin-bottom: var(--s2); }
.path button { all: unset; cursor: pointer; padding: 2px 6px; border-radius: 4px; color: var(--ink2); }
.path button:hover { background: var(--hover); color: var(--ink); }
.path button[aria-current="true"] { font-weight: var(--fw-strong); color: var(--ink); }
.path .sep { color: var(--line-strong); }

/* ---------- 마인드맵 ---------- */
.map { width: 100%; height: auto; display: block; user-select: none; }
.map .edge { stroke: var(--line); stroke-width: 1.5; fill: none; }
.map .edge.on { stroke: var(--line-strong); stroke-width: 2.25; }
.map .node { cursor: pointer; }
.map .node rect { fill: var(--surface); stroke: var(--line-sub); stroke-width: 1; }
.map .node text { fill: var(--ink2); font-size: 14px; font-weight: 500; dominant-baseline: central; text-anchor: middle; }
.map .node:hover rect { stroke: var(--line-strong); }
.map .node.root rect { fill: var(--ink); stroke: var(--ink); }
.map .node.root text { fill: var(--surface); font-size: 16px; font-weight: 600; }
.map .node.open rect { stroke: var(--line-strong); stroke-width: 1.5; }
.map .node.open text { fill: var(--ink); font-weight: 600; }
.map .node.picked rect { fill: var(--accent-soft); stroke: var(--sel-line); }
.map .node.picked text { fill: var(--accent); font-weight: 600; }
.map .node.focus rect { stroke: var(--accent); stroke-width: 2; }
.map .node:focus { outline: none; }
.map .node:focus-visible rect { stroke: var(--accent); stroke-width: 2.5; }
.map .node .more { fill: var(--mute); font-size: 11px; font-weight: 500; }
.map .node.dim { opacity: .28; }
.maphint { margin-top: var(--s2); }

/* ---------- 옆 패널: 키워드 근거 ---------- */
.side { position: sticky; top: var(--s5); }
.side h2 { font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: var(--fw-strong); }
.side h3 { font-size: var(--fs-sm); line-height: var(--lh-label); font-weight: var(--fw-strong); margin: var(--s4) 0 var(--s2); }
.side ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.side li { font-size: var(--fs-sm); }
.side li .cap { display: block; }
.side .tags { display: flex; flex-wrap: wrap; gap: 6px; }
.side .acts { margin-top: var(--s5); display: grid; gap: var(--s2); }
.side .sub { color: var(--mute); font-size: var(--fs-sm); margin-top: 4px; }

/* ---------- 아래 고정: 고른 키워드 → 컨셉 ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 5; }
.dock-in { max-width: 1280px; margin: 0 auto; padding: var(--s4) var(--s5); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s3) var(--s5); align-items: end; }
.pickbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 32px; grid-column: 1 / -1; }
.pickbar .l { font-size: var(--fs-sm); font-weight: var(--fw-strong); margin-right: 6px; }
.pk { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 6px 0 10px; border-radius: var(--r2); background: var(--accent-soft); color: var(--accent); font-size: var(--fs-sm); font-weight: var(--fw-strong); }
.pk button { all: unset; cursor: pointer; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 4px; }
.pk button:hover { background: rgba(0, 122, 70, .12); }
.fields { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--s3); }
@media (max-width: 800px) { .fields, .dock-in { grid-template-columns: minmax(0, 1fr); } }
.fld { display: grid; gap: 6px; }
.fld > span { font-size: var(--fs-sm); line-height: var(--lh-label); font-weight: var(--fw-strong); }
.fld > span em { font-style: normal; color: var(--mute); font-weight: var(--fw-medium); }
input[type=text] { height: var(--control-lg); border: 1px solid var(--line); border-radius: var(--r2); padding: 0 12px; color: var(--ink); background: var(--surface); width: 100%; }
input[type=text]:hover { border-color: var(--line-strong); }
input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.toast { position: fixed; left: 50%; bottom: 180px; transform: translateX(-50%); background: var(--ink); color: var(--surface); border-radius: var(--r); padding: 14px 18px; font-size: var(--fs-sm);
  box-shadow: 0 16px 48px -12px rgba(33, 33, 33, .15); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); z-index: 9; }
.toast.on { opacity: 1; }
</style>
</head>
<body>
<header class="top">
  <div class="logo"><i aria-hidden="true">a</i>AMOREAD</div>
  <span class="crumb"><a href="20_홈_일정표.html">홈</a> › 브리프</span>
  <span class="grow"></span>
  <span class="note">단계 이름·순서는 아직 정하지 않았어요</span>
</header>

<main class="page">
  <p class="demo"><b>예시 화면이에요.</b> 키워드, 채널, 검색 흐름, 기사 제목은 모두 가상의 값이에요. 외부 채널은 아직 연결하지 않았고, 실제 검색량이나 순위가 아니에요.</p>

  <div class="masthead">
    <div class="grow">
      <div class="overline">기획안 · 브리프</div>
      <label><span class="cap" hidden>기획안 이름</span><input class="title-in" id="title" maxlength="80" aria-label="기획안 이름"></label>
      <div class="facts">
        <button class="fact cls" data-edit="분류">시즌</button>
        <button class="fact" data-edit="명분"><span class="k">명분</span>봄</button>
        <button class="fact" data-edit="기간"><span class="k">기간</span>3/2(월) ~ 3/15(일)</button>
        <button class="fact" data-edit="페이지"><span class="k">페이지</span>이벤트</button>
      </div>
    </div>
  </div>

  <div class="layout">
    <section class="card" aria-labelledby="mapH">
      <div class="sec-head">
        <h2 id="mapH">키워드 펼치기</h2>
        <span class="tag demo-t">예시 데이터</span>
        <span class="grow"></span>
        <button class="btn sm" id="resetBtn">처음 모양으로</button>
      </div>
      <div class="filters" role="group" aria-label="채널 (고르지 않으면 전체)">
        <span class="cap">채널</span>
        <span id="chFilters"></span>
        <button class="btn sm" id="chClear" hidden>전체 보기</button>
      </div>
      <nav class="path" id="path" aria-label="지나온 길"></nav>
      <svg class="map" id="map" viewBox="0 0 1100 640" role="group" aria-label="키워드 마인드맵"></svg>
      <p class="cap maphint">키워드를 누르면 오른쪽에 근거가 나와요. 두 번 누르거나 [더 펼치기]를 누르면 그 키워드에서 다시 뻗어요. 한 번에 한 갈래만 펼쳐 보여요. 키보드: Tab으로 이동, Enter 근거 보기, Space 고르기, → 펼치기</p>
    </section>

    <aside class="card side" id="side" aria-live="polite"></aside>
  </div>
</main>

<div class="dock" role="region" aria-label="고른 키워드와 컨셉">
  <div class="dock-in">
    <div class="pickbar" id="picked"></div>
    <div class="fields">
      <label class="fld"><span>컨셉 한 줄</span><input type="text" id="concept" maxlength="120" placeholder="예) 피크닉에서 누리는 차 한 잔의 여유"></label>
      <label class="fld"><span>누구에게, 어떤 때 <em>(선택)</em></span><input type="text" id="who" maxlength="120" placeholder="예) 주말 한강 피크닉을 준비하는 20~30대"></label>
    </div>
    <button class="btn primary" id="nextBtn">메인 카피로 →</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// ---------------- 예시 데이터 (가상) ----------------
const CH = { search: '검색어', news: '뉴스', sns: 'SNS·블로그', trend: '트렌드 매체', ours: '우리 데이터' };
// 채널 설명: 연결 후보 (plans/20 3장). 지금은 모두 예시
const CH_SRC = { search: '네이버 검색광고 키워드 도구·데이터랩, 구글 트렌드', news: '빅카인즈, 네이버 뉴스', sns: '블로그·SNS 글', trend: '캐릿 등 트렌드 매체', ours: '명분 사전 씨앗, 지난 컨셉, 리뷰 언급' };
// k: 키워드, ch: 채널, flow: 검색 흐름(말로만, 숫자 없음), posts: 관련 글 제목(가상), ours: 우리 데이터(가상), kids: 다음 가지
const T = {
  '봄': { ch: [], kids: ['벚꽃', '피크닉', '새학기', '춘곤증', '미세먼지', '봄나물', '화이트데이', '산책', '봄비', '꽃가루'] },
  '벚꽃': { ch: ['search', 'news', 'sns'], flow: '3월 말에 크게 늘어요', posts: [['news', '올해 벚꽃 개화 예상 시기'], ['sns', '벚꽃 아래 티타임 기록']], ours: ['작년 봄 컨셉에 썼어요 (벚꽃 티타임)'], kids: ['벚꽃 명소', '핑크 디저트', '야간 벚꽃', '체리블라썸 한정'] },
  '피크닉': { ch: ['search', 'sns', 'trend'], flow: '3월부터 꾸준히 늘어요', posts: [['trend', '요즘 피크닉은 이렇게 차려요'], ['sns', '한강 피크닉 준비물 정리'], ['news', '봄 나들이 수요 늘어']], ours: ['지난 컨셉에 쓴 적 없어요', '리뷰에 "나들이" 언급 조금'], kids: ['도시락', '돗자리', '한강', '보온병', '아이스티', '캠핑'] },
  '새학기': { ch: ['search', 'news'], flow: '2월 말~3월 초에 몰려요', posts: [['news', '새 학기 준비 소비 늘어']], ours: ['명분 사전에 있어요 (학사)'], kids: ['신입생', '공부 루틴', '집중력', '선생님 선물'] },
  '춘곤증': { ch: ['search', 'sns'], flow: '3~4월에 늘어요', posts: [['sns', '오후 3시 졸음 이기는 법']], ours: ['지난 컨셉에 쓴 적 없어요'], kids: ['오후 3시', '리프레시', '사무실 간식', '카페인'] },
  '미세먼지': { ch: ['search', 'news'], flow: '날마다 오르내려요', posts: [['news', '봄철 미세먼지 주의보']], ours: [], kids: ['실내 활동', '홈카페', '따뜻한 차'] },
  '봄나물': { ch: ['search', 'trend'], flow: '3월에 늘어요', posts: [['trend', '제철 봄나물 레시피']], ours: [], kids: ['쑥', '냉이', '건강 식단'] },
  '화이트데이': { ch: ['search', 'news', 'ours'], flow: '3월 초에 몰려요', posts: [['news', '화이트데이 선물 트렌드']], ours: ['명분 사전에 있어요 (기념일)', '리뷰에 "선물" 언급 많아요'], kids: ['사탕 대신', '커플 선물', '답례'] },
  '산책': { ch: ['sns'], flow: '봄 내내 비슷해요', posts: [['sns', '동네 산책 코스 추천']], ours: [], kids: ['텀블러', '러닝', '동네 카페'] },
  '봄비': { ch: ['sns', 'search'], flow: '4월에 조금 늘어요', posts: [['sns', '비 오는 날 집에서']], ours: [], kids: ['빗소리', '따뜻한 차'] },
  '꽃가루': { ch: ['search', 'news'], flow: '4월에 늘어요', posts: [['news', '꽃가루 알레르기 시즌']], ours: ['효능처럼 읽힐 수 있어 문구 검토가 필요해요'], kids: [] },
  '도시락': { ch: ['search', 'sns'], flow: '주말마다 늘어요', posts: [['sns', '피크닉 도시락 메뉴']], ours: [], kids: ['샌드위치', '디저트 박스', '김밥'] },
  '보온병': { ch: ['search', 'trend'], flow: '3월에 늘어요', posts: [['trend', '들고 다니는 차, 요즘 텀블러']], ours: ['연결 상품: 휴대용 티 세트 (예시)'], kids: ['텀블러', '콜드브루 티'] },
  '아이스티': { ch: ['search', 'sns'], flow: '4월부터 늘어요', posts: [['sns', '홈메이드 아이스티']], ours: ['연결 상품: 콜드브루 티백 (예시)'], kids: ['콜드브루 티', '과일 티'] },
  '한강': { ch: ['sns', 'search'], flow: '주말마다 늘어요', posts: [['sns', '한강 노을 피크닉']], ours: [], kids: ['노을', '자전거'] },
  '홈카페': { ch: ['search', 'sns', 'trend'], flow: '꾸준해요', posts: [['trend', '홈카페 티 블렌딩']], ours: ['지난 컨셉에 썼어요 (겨울 홈카페)'], kids: ['티 블렌딩', '라떼'] },
  '쑥': { ch: ['search', 'trend'], flow: '3월에 늘어요', posts: [['trend', '쑥 디저트가 다시 뜬다']], ours: ['연결 상품: 쑥 블렌딩 티 (예시)'], kids: ['쑥라떼', '쑥 디저트'] },
  '사무실 간식': { ch: ['search', 'sns'], flow: '꾸준해요', posts: [['sns', '탕비실 간식 추천']], ours: ['리뷰에 "사무실" 언급 조금'], kids: ['티백', '스틱 차'] },
};
const info = k => T[k] || { ch: ['search'], flow: '예시 데이터가 아직 없어요', posts: [], ours: [], kids: [] };

// ---------------- 상태 ----------------
const ROOT = '봄';
let path = [ROOT];       // 지나온 길 (한 갈래만 펼침). path[i+1]은 path[i]의 가지
let center = 0;          // path에서 가운데에 놓인 위치 (3단계를 넘으면 가운데를 옮긴다)
let focus = ROOT;        // 옆 패널에 보이는 키워드
let picked = [];         // 고른 키워드
let chOn = new Set();    // 채널 필터 (비어 있으면 전체)
const MAX_DEPTH = 3;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NS = 'http://www.w3.org/2000/svg';
const svgEl = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; };
const visibleByCh = k => !chOn.size || info(k).ch.some(c => chOn.has(c));

// 보이는 나무: 가운데 키워드의 가지 + 펼친 갈래의 가지 (한 갈래만)
function tree() {
  const root = { k: path[center], depth: 0, kids: [] };
  let cur = root;
  for (let d = center; d < path.length; d++) {
    const k = path[d];
    cur.kids = info(k).kids.map(c => ({ k: c, depth: cur.depth + 1, kids: [] }));
    const nx = path[d + 1]; if (!nx) break;
    cur = cur.kids.find(c => c.k === nx); if (!cur) break;
  }
  return root;
}
// 방사형 배치: 잎 수에 비례해 각도를 나눈다 (펼친 갈래가 자리를 더 가져감)
function leaves(n) { return n.kids.length ? n.kids.reduce((s, c) => s + leaves(c), 0) : 1; }
function layout(root) {
  const R = [0, 150, 255, 345], CX = 550, CY = 320, SX = 1.42, SY = 0.86, out = [];
  (function walk(n, a0, a1) {
    const a = (a0 + a1) / 2, r = R[n.depth];
    n.x = CX + Math.cos(a) * r * SX; n.y = CY + Math.sin(a) * r * SY; out.push(n);
    const tot = leaves(n); let s = a0;
    n.kids.forEach(c => { const w = (a1 - a0) * leaves(c) / tot; walk(c, s, s + w); c.parent = n; s += w; });
  })(root, -Math.PI / 2, Math.PI * 1.5);
  return out;
}

function renderMap() {
  const svg = $('#map'); svg.innerHTML = '';
  const nodes = layout(tree()), onPath = new Set(path.slice(center));
  const gE = svgEl('g', {}), gN = svgEl('g', {}); svg.append(gE, gN);
  nodes.forEach(n => {
    if (n.parent) {
      const on = onPath.has(n.k) && onPath.has(n.parent.k);
      const mx = (n.x + n.parent.x) / 2, my = (n.y + n.parent.y) / 2;
      gE.append(svgEl('path', { class: `edge${on ? ' on' : ''}`, d: `M${n.parent.x},${n.parent.y} Q${mx},${n.parent.y} ${n.x},${n.y}` }));
    }
    const kids = info(n.k).kids.length, isOpen = onPath.has(n.k) && n.depth > 0 && path.indexOf(n.k) < path.length - 1;
    const cls = ['node', n.depth === 0 ? 'root' : '', isOpen ? 'open' : '', picked.includes(n.k) ? 'picked' : '', focus === n.k ? 'focus' : '',
      n.depth > 0 && !visibleByCh(n.k) && !onPath.has(n.k) ? 'dim' : ''].filter(Boolean).join(' ');
    const g = svgEl('g', { class: cls, tabindex: 0, role: 'button', 'data-k': n.k,
      'aria-label': `${n.k}${picked.includes(n.k) ? ', 고름' : ''}${kids && n.depth > 0 && !isOpen ? `, 가지 ${kids}개 더 있음` : ''}` });
    const t = svgEl('text', { x: n.x, y: n.y }); t.textContent = n.k; g.append(t); gN.append(g);
    const w = Math.max(48, t.getComputedTextLength() + (n.depth === 0 ? 40 : 28)), h = n.depth === 0 ? 44 : 34;
    g.insertBefore(svgEl('rect', { x: n.x - w / 2, y: n.y - h / 2, width: w, height: h, rx: 8 }), t);
    if (n.depth > 0 && kids && !isOpen) { const m = svgEl('text', { class: 'more', x: n.x + w / 2 + 10, y: n.y }); m.textContent = `+${kids}`; g.append(m); }
  });
}

function renderPath() {
  $('#path').innerHTML = '<span class="cap">지나온 길</span>' + path.map((k, i) =>
    `${i ? '<span class="sep" aria-hidden="true">›</span>' : ''}<button data-path="${i}" ${i === path.length - 1 ? 'aria-current="true"' : ''}>${esc(k)}</button>`).join('');
}
function renderFilters() {
  $('#chFilters').innerHTML = Object.entries(CH).map(([c, n]) => `<button class="chip" data-ch="${c}" aria-pressed="${chOn.has(c)}" title="${esc(CH_SRC[c])}">${n}</button>`).join(' ');
  $('#chClear').hidden = !chOn.size;
}
function renderSide() {
  const k = focus, d = info(k), el = $('#side');
  if (k === ROOT && center === 0) {
    el.innerHTML = `<div class="overline">중심 키워드 · 명분</div><h2>${esc(k)}</h2>
      <p class="sub">여기서 뻗어 나간 키워드 중 마음에 드는 걸 눌러 보세요. 명분을 그대로 써도 좋으면 중심 키워드를 골라도 돼요.</p>
      <div class="acts"><button class="btn" data-pick="${esc(k)}">${picked.includes(k) ? '고른 키워드에서 빼기' : '이 키워드 그대로 쓰기'}</button></div>`;
    return;
  }
  const canOpen = d.kids.length > 0, isOpen = path.includes(k) && path.indexOf(k) < path.length - 1;
  const deep = path.indexOf(k) >= 0 ? path.indexOf(k) - center : parentOf(k) - center + 1;
  el.innerHTML = `<div class="overline">키워드 <span class="tag demo-t">예시</span></div><h2>${esc(k)}</h2>
    <h3>어디서 왔나요</h3><div class="tags">${d.ch.map(c => `<span class="tag" title="${esc(CH_SRC[c])}">${CH[c]}</span>`).join('') || '<span class="cap">-</span>'}</div>
    <h3>검색 흐름</h3><p class="cap">${esc(d.flow)} · 숫자는 연결 후 보여줘요</p>
    <h3>관련 글</h3>${d.posts.length ? `<ul>${d.posts.map(([c, t]) => `<li>${esc(t)}<span class="cap">${CH[c]} · 예시 제목</span></li>`).join('')}</ul>` : '<p class="cap">아직 없어요</p>'}
    <h3>우리 데이터</h3>${d.ours.length ? `<ul>${d.ours.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` : '<p class="cap">연결된 내용이 없어요</p>'}
    <div class="acts">
      <button class="btn primary" data-pick="${esc(k)}">${picked.includes(k) ? '고른 키워드에서 빼기' : '이 키워드 고르기'}</button>
      <button class="btn" data-open-k="${esc(k)}" ${canOpen && !isOpen ? '' : 'disabled'}>${!canOpen ? '더 펼칠 키워드가 없어요' : isOpen ? '펼쳐 둔 갈래예요' : deep >= MAX_DEPTH ? '가운데로 옮겨서 펼치기' : `더 펼치기 (${d.kids.length})`}</button>
    </div>`;
}
function renderDock() {
  $('#picked').innerHTML = '<span class="l">고른 키워드</span>' + (picked.length ? picked.map(k => `<span class="pk">${esc(k)}<button data-unpick="${esc(k)}" aria-label="${esc(k)} 빼기">✕</button></span>`).join('')
    : '<span class="cap">마인드맵에서 키워드를 골라 주세요. 여러 개 골라도 돼요.</span>');
}
let keepFocus = null;   // 다시 그린 뒤에도 키보드 위치를 잃지 않게
function render() { renderPath(); renderFilters(); renderMap(); renderSide(); renderDock();
  if (keepFocus) { document.querySelector(`.node[data-k="${CSS.escape(keepFocus)}"]`)?.focus(); keepFocus = null; } }

// ---------------- 동작 ----------------
function parentOf(k) {   // 보이는 나무에서 k의 부모 (path 위에서 찾음)
  for (let i = center; i < path.length; i++) if (info(path[i]).kids.includes(k)) return i;
  return -1;
}
function openK(k) {
  if (!info(k).kids.length) return;
  let i = path.indexOf(k);
  if (i < 0) { const p = parentOf(k); if (p < 0) return; path = path.slice(0, p + 1).concat(k); i = path.length - 1; }
  else path = path.slice(0, i + 1);
  if (i - center >= MAX_DEPTH) center = i - 1;   // 3단계를 넘으면 한 단계 위를 가운데로
  focus = k; render();
}
function pick(k) { picked = picked.includes(k) ? picked.filter(x => x !== k) : picked.concat(k); autoTitle(); render(); }
let titleTouched = false;
function autoTitle() { if (titleTouched) return; const c = $('#concept').value.trim(); $('#title').value = c ? `봄 · ${c}` : `봄${picked.length ? ` · ${picked.join(', ')}` : ''} 기획안`; }
let clickT = null;
$('#map').addEventListener('click', e => {
  const g = e.target.closest('.node'); if (!g) return;
  const k = g.dataset.k;
  if (clickT && clickT.k === k) { clearTimeout(clickT.t); clickT = null; openK(k); return; }   // 두 번 누르면 펼치기
  focus = k; render();
  clickT = { k, t: setTimeout(() => { clickT = null; }, 320) };
});
$('#map').addEventListener('keydown', e => {
  const g = e.target.closest('.node'); if (!g) return;
  keepFocus = g.dataset.k;
  if (e.key === 'Enter') { e.preventDefault(); focus = g.dataset.k; render(); }
  else if (e.key === ' ') { e.preventDefault(); pick(g.dataset.k); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); openK(g.dataset.k); }
  else keepFocus = null;
});
document.addEventListener('click', e => {
  const t = e.target;
  const p = t.closest('[data-pick]'); if (p) { pick(p.dataset.pick); return; }
  const o = t.closest('[data-open-k]'); if (o) { openK(o.dataset.openK); return; }
  const u = t.closest('[data-unpick]'); if (u) { pick(u.dataset.unpick); return; }
  const pa = t.closest('[data-path]');
  if (pa) { const i = +pa.dataset.path; path = path.slice(0, i + 1); center = Math.min(center, Math.max(0, i - 1)); if (i === 0) center = 0; focus = path[i]; render(); return; }
  const c = t.closest('[data-ch]'); if (c) { chOn.has(c.dataset.ch) ? chOn.delete(c.dataset.ch) : chOn.add(c.dataset.ch); render(); return; }
  const ed = t.closest('[data-edit]'); if (ed) { toast(`예시예요: ${ed.dataset.edit}을 여기서 바로 고칠 수 있어요`); return; }
});
$('#chClear').addEventListener('click', () => { chOn.clear(); render(); });
$('#resetBtn').addEventListener('click', () => { path = [ROOT]; center = 0; focus = ROOT; render(); });
$('#title').addEventListener('input', () => { titleTouched = true; });
$('#concept').addEventListener('input', autoTitle);
$('#nextBtn').addEventListener('click', () => {
  if (!picked.length && !$('#concept').value.trim()) { toast('키워드를 하나 이상 고르거나 컨셉을 적어 주세요'); return; }
  toast(`예시예요: 고른 키워드(${picked.join(', ') || '없음'})와 컨셉으로 메인 카피 화면으로 넘어가요`);
});
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2600); }

autoTitle(); render();
</script>
</body>
</html>
