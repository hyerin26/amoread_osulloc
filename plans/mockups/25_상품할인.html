<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품 할인 목업</title>
<!-- 디자인 기준: AMOREAD Green UI v2.5.1. 색·글자·간격은 앱의 tokens.css를 그대로 읽는다 -->
<link rel="stylesheet" href="../../workspace/amoread_app/planner/static/tokens.css">
<style>
@font-face { font-family: 'Pretendard Variable'; font-weight: 45 920; font-display: swap;
  src: url('../../workspace/amoread_app/planner/static/fonts/PretendardVariable.woff2') format('woff2-variations'); }
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); font-size: var(--fs-body); line-height: var(--lh-body); color: var(--ink); background: var(--bg); }
button, input, select { font: inherit; }
h1, h2, h3, h4, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.cap { font-size: var(--fs-cap); line-height: var(--lh-cap); color: var(--mute); }
.hint { font-size: var(--fs-cap); color: var(--mute); }
.top { height: 72px; display: flex; align-items: center; gap: var(--s4); padding: 0 var(--s5); background: var(--shell); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 10px; font-weight: var(--fw-title); font-size: var(--fs-h1); letter-spacing: -0.01em; }
.logo i { width: 32px; height: 32px; border-radius: var(--r2); background: var(--ink); color: var(--surface); display: grid; place-items: center; font-style: normal; font-size: var(--fs-h1); }
.crumb { color: var(--mute); font-size: var(--fs-sm); }
.crumb a { color: var(--mute); text-decoration: none; }
.crumb a:hover { color: var(--ink); }
.top .grow { flex: 1; }
.top .note { color: var(--mute); font-size: var(--fs-cap); }
.page { max-width: 1440px; margin: 0 auto; padding: var(--s5) var(--s5) 64px; }
.demo { background: var(--warn-soft); color: var(--warn); border-radius: var(--r); padding: 12px 16px; font-size: var(--fs-sm); line-height: var(--lh-label); margin-bottom: var(--s4); }
.demo b { font-weight: var(--fw-strong); }
.head { display: flex; align-items: flex-end; gap: var(--s4); flex-wrap: wrap; margin-bottom: var(--s3); }
.head .grow { flex: 1; min-width: 280px; }
.overline { font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: var(--fw-medium); color: var(--mute); margin-bottom: 4px; }
.head h1 { font-size: var(--fs-masthead); line-height: var(--lh-masthead); font-weight: var(--fw-title); letter-spacing: -0.02em; }
.head p { margin-top: 6px; color: var(--mute); }
.head .acts { display: flex; gap: var(--s2); flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--control-lg); padding: 0 16px; border: 0; border-radius: var(--r2);
  background: var(--sunken); color: var(--ink); font-weight: var(--fw-strong); line-height: var(--lh-label); cursor: pointer; white-space: nowrap; text-decoration: none; }
.btn:hover { background: var(--line-sub); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(.94); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: var(--control-md); padding: 0 12px; font-size: var(--fs-sm); }
.btn.xs { height: 28px; padding: 0 8px; font-size: var(--fs-cap); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid var(--line-sub); border-radius: var(--r2); background: var(--surface);
  color: var(--ink2); font-size: var(--fs-cap); font-weight: var(--fw-medium); cursor: pointer; }
.chip:hover { border-color: var(--line-strong); color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--sel-line); color: var(--accent); font-weight: var(--fw-strong); }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { display: inline-flex; align-items: center; border-radius: var(--r2); padding: 2px 8px; font-size: var(--fs-cap); line-height: var(--lh-cap); font-weight: var(--fw-medium); background: var(--sunken); color: var(--ink2); white-space: nowrap; }
.tag.demo-t { background: var(--warn-soft); color: var(--warn); }
.tag.off { background: transparent; border: 1px dashed var(--line-strong); color: var(--mute); }
.tag.deal { background: var(--deal-soft); color: var(--deal-ink); }
.tag.sangsi { background: var(--sangsi-soft); color: var(--sangsi); }
.seg { display: inline-flex; gap: 4px; padding: 4px; background: var(--sunken); border-radius: var(--r2); max-width: 100%; overflow-x: auto; }
.seg > button { all: unset; box-sizing: border-box; cursor: pointer; display: inline-flex; align-items: center; min-height: var(--control-sm); padding: 6px 14px; border-radius: 6px;
  color: var(--mute); font-size: var(--fs-sm); line-height: var(--lh-label); font-weight: var(--fw-medium); white-space: nowrap; }
.seg > button:hover { color: var(--ink); }
.seg > button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: var(--fw-strong); }
.seg > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
input[type=text], input[type=number], input[type=search], select { height: var(--control-md); border: 1px solid var(--line); border-radius: var(--r2); padding: 0 10px; color: var(--ink); background: var(--surface); min-width: 0; }
input:hover, select:hover { border-color: var(--line-strong); }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.ck { display: inline-flex; gap: 6px; align-items: center; font-size: var(--fs-sm); cursor: pointer; }
.card { background: var(--surface); border: 1px solid var(--line-sub); border-radius: var(--r); padding: var(--s4); min-width: 0; display: grid; gap: var(--s3); align-content: start; }   /* 카드 안 덩어리끼리 늘 간격 (제목·문단 여백을 0으로 둬서 붙어 보이던 것) */
.card > .filters { margin-bottom: 0; }
#body { display: grid; gap: var(--s3); }   /* 탭 본문의 덩어리끼리 (묶음 탭: 조건 줄 · 기준 안내 · 추천 · 직접 만들기) */
#body > .filters { margin-bottom: 0; }
.card h2 { font-size: var(--fs-h2); line-height: var(--lh-h2); font-weight: var(--fw-strong); }

/* 요약 한 줄 */
.sum { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); padding: 12px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line-sub); margin-bottom: var(--s4); font-size: var(--fs-sm); }
.sum b { font-weight: var(--fw-strong); font-variant-numeric: tabular-nums; }
.sum .k { color: var(--mute); margin-right: 6px; }
.sum .warn b { color: var(--warn); }
.tabbar { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; margin-bottom: var(--s3); }
.tabbar .grow { flex: 1; }

/* 할인 상품: 표 + 옆 근거 */
.lay { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--s4); align-items: start; }
@media (max-width: 1180px) { .lay { grid-template-columns: minmax(0, 1fr); } }
.lay > * { min-width: 0; }
.tbl-wrap { overflow-x: auto; max-width: 100%; }
table.t { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); }
table.t th { text-align: left; font-weight: var(--fw-medium); color: var(--mute); background: var(--bg); padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: var(--fs-cap); }
table.t td { padding: 8px; border-bottom: 1px solid var(--line-sub); vertical-align: middle; white-space: nowrap; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.t tbody tr { cursor: pointer; }
table.t tbody tr:hover td { background: var(--bg); }
table.t tbody tr[aria-selected="true"] td { background: var(--accent-soft); }
table.t td.pn { white-space: normal; min-width: 150px; }
table.t td.pn b { font-weight: var(--fw-medium); display: block; }
table.t td.where { white-space: normal; min-width: 120px; font-size: var(--fs-cap); }
table.t td.fin { color: var(--price); font-weight: var(--fw-strong); }
table.t td.fin small { display: block; font-size: 10px; color: var(--mute); font-weight: var(--fw-medium); }
table.t td input[type=number] { width: 56px; height: 28px; text-align: right; padding: 0 4px; }
table.t td .draft { color: var(--accent); font-size: 10px; font-weight: var(--fw-strong); display: block; }
.cra.warn { color: var(--warn); font-weight: var(--fw-strong); }
.judge { font-size: var(--fs-cap); line-height: var(--lh-cap); padding: 2px 8px; border-radius: var(--r2); font-weight: var(--fw-strong); white-space: nowrap; }
.judge.ok { background: var(--ok-soft); color: var(--ok); }
.judge.warn { background: var(--warn-soft); color: var(--warn); }
.judge.err { background: var(--err-soft); color: var(--err); }
.judge.none { background: var(--sunken); color: var(--mute); font-weight: var(--fw-medium); }
.filters { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; margin-bottom: var(--s3); }
.applybar { position: sticky; bottom: 0; display: flex; gap: var(--s2); align-items: center; margin-top: var(--s3); padding: 10px 12px; border-radius: var(--r2); background: var(--accent-soft); color: var(--accent); font-size: var(--fs-sm); font-weight: var(--fw-medium); }
.applybar .grow { flex: 1; }
.side { position: sticky; top: var(--s4); display: grid; gap: var(--s3); }
.side h3 { font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: var(--fw-strong); }
.side h4 { font-size: var(--fs-sm); font-weight: var(--fw-strong); margin-bottom: 6px; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 4px var(--s3); font-size: var(--fs-sm); }
.kv span:nth-child(odd) { color: var(--mute); }
.bars { display: grid; gap: 4px; }
.bar { display: grid; grid-template-columns: 64px minmax(0, 1fr) 48px; gap: 8px; align-items: center; font-size: var(--fs-cap); }
.bar i { display: block; height: 10px; border-radius: 3px; background: var(--line-strong); }
.bar.on i { background: var(--accent); }
.bar.on { font-weight: var(--fw-strong); }
.mini { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: var(--fs-cap); }
.mini li { display: flex; gap: 6px; flex-wrap: wrap; }
.f { display: grid; gap: 6px; }
.f > span { font-size: var(--fs-sm); font-weight: var(--fw-strong); }
.f em { font-style: normal; color: var(--mute); font-weight: var(--fw-medium); }
.f input[type=text] { width: 100%; }
.warnline { font-size: var(--fs-cap); color: var(--warn); background: var(--warn-soft); border-radius: 6px; padding: 4px 8px; }

/* 하루특가 */
.dgrid { display: grid; gap: var(--s2); }
.dday { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: var(--s3); align-items: start; padding: 10px; border: 1px solid var(--line-sub); border-radius: var(--r2); background: var(--surface); }
.dday .dh { font-weight: var(--fw-strong); font-size: var(--fs-sm); }
.dday .dh small { display: block; font-size: var(--fs-cap); color: var(--mute); font-weight: var(--fw-medium); }
.dday .dh small.warn { color: var(--warn); font-weight: var(--fw-strong); }
.slots { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; }
@media (max-width: 900px) { .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.sl { border: 1px solid var(--line-sub); border-radius: var(--r2); padding: 8px 10px; display: grid; gap: 4px; align-content: start; font-size: var(--fs-cap); line-height: var(--lh-cap); min-height: 92px; min-width: 0; }
.sl b { font-size: var(--fs-sm); line-height: var(--lh-label); font-weight: var(--fw-medium); word-break: keep-all; overflow-wrap: anywhere; }
.sl .foot { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 2px; }
.sl .pp { color: var(--price); font-weight: var(--fw-strong); }
.sl.empty { border-style: dashed; align-content: center; justify-items: start; gap: 6px; }
.dday > div { display: grid; gap: var(--s2); min-width: 0; }
.cands { display: grid; gap: 6px; }
.cand { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px var(--s3); align-items: center; padding: 8px 10px; border: 1px solid var(--line-sub); border-radius: var(--r2); background: var(--bg); font-size: var(--fs-sm); }
.cand .meta { grid-column: 1; font-size: var(--fs-cap); color: var(--mute); }
.cand .btn { grid-row: 1 / span 2; grid-column: 2; }
.lever { background: var(--accent-soft); color: var(--accent); border-radius: var(--r2); padding: 10px 12px; font-size: var(--fs-cap); line-height: var(--lh-cap); }

/* 추가 혜택 */
.ex { display: grid; gap: var(--s3); }
.exrow { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.4fr) minmax(0, .6fr) minmax(0, 1fr); gap: var(--s3) var(--s4); align-items: end; }
@media (max-width: 900px) { .exrow { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.exrow .f select, .exrow .f input { width: 100%; }
.exrow .f > span { display: flex; flex-direction: column; gap: 2px; }   /* 이름과 설명이 좁은 칸에서 겹치지 않게 두 줄로 */
.exrow .f > span em { font-size: var(--fs-cap); line-height: var(--lh-cap); }
.ex > .card .chips-row { gap: 6px 8px; }

/* 후보 상품 */
.pool { display: grid; gap: var(--s2); }
.pitem { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 10px 12px; border: 1px solid var(--line-sub); border-radius: var(--r2); background: var(--surface); }
.pitem .meta { font-size: var(--fs-cap); color: var(--mute); }
.pitem .acts { display: flex; gap: 6px; flex-wrap: wrap; }   /* 버튼 5개를 이름 옆에 두면 이름이 눌려서, 아래 줄로 */
.bcard { display: grid; gap: var(--s3); }
.blist { display: grid; gap: var(--s3); }
.bh { display: flex; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; align-items: baseline; }
.bh b { display: block; font-size: var(--fs-h2); }
.bparts { display: grid; gap: 6px; }
.bp { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: var(--s3); align-items: center; padding: 10px 12px; border: 1px solid var(--line-sub); border-radius: var(--r2); font-size: var(--fs-sm); }
@media (max-width: 1180px) { .bp { grid-template-columns: minmax(0, 1fr) auto; } .bp .acts { grid-column: 1 / -1; } }
@media (max-width: 700px) { .bp { grid-template-columns: minmax(0, 1fr); } .bp .num { text-align: left; } }
.bp .pn b { font-weight: var(--fw-medium); } .bp .pn .cap { display: block; }
.bp .num { text-align: right; font-variant-numeric: tabular-nums; font-size: var(--fs-cap); }
.bp .acts { display: flex; gap: 4px; flex-wrap: wrap; }
.pp { color: var(--price); font-weight: var(--fw-strong); }
.mini.calc li { justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line-sub); }
#calcBox { display: grid; gap: var(--s3); }
#calcRate { width: 64px; }
.toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: var(--ink); color: var(--surface); border-radius: var(--r); padding: 14px 18px; font-size: var(--fs-sm);
  box-shadow: 0 16px 48px -12px rgba(33, 33, 33, .15); opacity: 0; pointer-events: none; transition: opacity .2s var(--ease); z-index: 30; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; }

/* 서랍 (상품 상세 · 지난 행사 할인 기준) — 예전 '상품'·'지난 성과' 메뉴가 이 공간 안으로 */
[hidden] { display: none !important; }
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 19; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--surface); border-left: 1px solid var(--line); z-index: 20; display: flex; flex-direction: column; box-shadow: -16px 0 48px -24px rgba(20,20,20,.2); }
.drawer .dh { padding: var(--s4); border-bottom: 1px solid var(--line-sub); display: flex; gap: var(--s2); align-items: flex-start; }
.drawer .dh .grow { flex: 1; min-width: 0; }
.drawer .dh h2 { font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: var(--fw-strong); word-break: keep-all; }
.drawer .db { padding: var(--s4); overflow: auto; display: grid; gap: var(--s4); align-content: start; }
.drawer .db > * { min-width: 0; }
.drawer .dh .grow { display: grid; gap: 4px; }
.drawer .dh .overline { margin-bottom: 0; }
.drawer .ps { display: grid; gap: var(--s2); align-content: start; min-width: 0; }
.drawer h4 { font-size: var(--fs-sm); line-height: var(--lh-label); font-weight: var(--fw-strong); }
.drawer h4 .hint { font-weight: var(--fw-medium); margin-left: 4px; }
.drawer .kv { grid-template-columns: 128px minmax(0, 1fr); gap: var(--s2) var(--s3); line-height: var(--lh-label); }
.drawer .kv .hint { margin-left: 4px; }
.drawer table.t td:first-child { white-space: normal; min-width: 140px; }
.drawer .tbl-wrap { border: 1px solid var(--line-sub); border-radius: var(--r2); }
.drawer .tbl-wrap table.t tr:last-child td { border-bottom: 0; }
.drawer .is-over { color: var(--warn); }
.drawer .mini { gap: var(--s1, 4px); line-height: var(--lh-label); }
.linkbtn { all: unset; cursor: pointer; font-weight: var(--fw-medium); text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
.linkbtn:hover { text-decoration-color: var(--ink); }
.linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.lvb { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.lvb > div { border: 1px solid var(--line-sub); border-radius: var(--r2); padding: 12px; display: grid; gap: 6px; align-content: start; }
.lvb b { font-size: var(--fs-sm); font-weight: var(--fw-strong); }
.lvb .say { font-size: var(--fs-sm); line-height: var(--lh-label); }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 48px; }
.spark i { flex: 1; min-width: 2px; background: var(--line-strong); border-radius: 2px 2px 0 0; height: var(--h, 10%); }
.spark i.ev { background: var(--accent); }
.simrow { display: flex; gap: var(--s2) var(--s4); align-items: center; flex-wrap: wrap; font-size: var(--fs-sm); }
.simrow label { display: inline-flex; gap: var(--s2); align-items: center; }
.puts { display: flex; gap: 6px; flex-wrap: wrap; }
@media (max-width: 560px) { .lvb { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="top">
  <div class="logo"><i aria-hidden="true">a</i>AMOREAD</div>
  <span class="crumb"><a href="20_홈_일정표.html">홈</a> › 상품·할인</span>
  <span class="grow"></span>
  <span class="note">기획안 어느 단계에서나 여는 공간 · 메뉴 위치는 '앱 전체 틀'에서 정해요</span>
</header>
<main class="page">
  <p class="demo"><b>예시 화면이에요.</b> 구좌 편집 목업과 같은 예시 기획안이에요. 상품, 가격, 원가, 반응, 예상 매출은 모두 가상의 값이에요. 판정 기준(할인 후 원가율 45%)만 지금 툴과 같아요.</p>
  <div class="head"><div class="grow"><div class="overline">기획안 · 상품·할인</div><h1>봄 · 피크닉에서 누리는 차 한 잔의 여유</h1>
    <p>어떤 상품을 얼마에, 언제 팔지 정해요. 구좌 편집에서 고친 할인과 같은 값이에요. 원가율 숫자는 이 공간에서만 보여요.</p></div>
    <div class="acts"><button class="btn sm" data-toast="예시예요: 구좌 편집과 같은 상품 엑셀 양식(맨 앞 '구좌·탭' 열 + PROMO_WORK 13열)을 내려받아요">상품 엑셀 양식 받기</button>
      <button class="btn sm" data-toast="예시예요: 올린 엑셀에서 바뀌는 것을 먼저 보여 주고 반영해요 (구좌 편집과 같은 창)">엑셀 올리기</button>
      <button class="btn sm" data-levers>지난 행사 할인 기준</button></div></div>
  <div class="sum" id="sum"></div>
  <div class="tabbar"><div class="seg" role="tablist" aria-label="상품·할인" id="tabs"></div></div>

// 하루특가: 날짜 × 자리. 월·화·수 (블프 '월/수 특가' 같은 요일 리듬, 예시)
const DEAL_DATES = ['2026-03-02', '2026-03-03', '2026-03-04', '2026-03-09', '2026-03-10', '2026-03-11'];
let slotsPerDay = 4;
let deals = { '2026-03-02': [['P102', 0.35], ['P109', 0.3], ['P101', 0.4]], '2026-03-03': [['P105', 0.4]], '2026-03-04': [['P107', 0.4], ['P108', 0.35], ['P106', 0.3], ['P109', 0.35], ['P102', 0.3]] };
let pool = [{ seq: 'P102', src: '브리프 키워드 · 보온병' }, { seq: 'P105', src: '리뷰 · 재구매 언급' }];

// ================= 계산 (구좌 편집과 같은 규칙) =================
const r10 = n => Math.round(n / 10) * 10;
const won = n => `${Math.round(n).toLocaleString('ko-KR')}원`;
const man = n => `${Math.round(n / 10000).toLocaleString('ko-KR')}만`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const md = d => `${+d.slice(5, 7)}/${+d.slice(8)}`;
const days = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5) + 1;
let drafts = {};
const itemOf = seq => items.find(i => i.seq === seq);
const rateOf = seq => seq in drafts ? drafts[seq] : (itemOf(seq)?.rate ?? 0);
const extraOf = seq => extras.find(x => x.seqs.includes(seq)) || null;
function priceOf(seq, rate = rateOf(seq), ex = extraOf(seq)) {
  const p = P[seq], first = r10(p.price * (1 - rate));
  const fin = !ex ? first : ex.calc === 'sale_pct' ? r10(first * (1 - ex.val / 100)) : ex.calc === 'won' ? Math.max(0, first - ex.val) : r10(Math.min(first, p.price * (1 - ex.val / 100)));
  return { list: p.price, first, fin, ex, pct: Math.round((1 - fin / p.price) * 100) };
}
const craOf = (seq, fin) => P[seq].cost / (fin / 1.1);
function judge(seq, pr = priceOf(seq)) {
  if (pr.fin >= pr.list) return { lv: 'none', t: '할인 없음' };
  if (1 - pr.fin / pr.list >= 0.8) return { lv: 'err', t: '확인 필요' };
  return craOf(seq, pr.fin) > TARGET ? { lv: 'warn', t: '주의' } : { lv: 'ok', t: '괜찮음' };
}
// 기준 안 가장 깊은 1단 할인 (%), 추가 혜택 포함
function maxRate(seq) { for (let r = 80; r >= 0; r--) { if (craOf(seq, priceOf(seq, r / 100).fin) <= TARGET) return r; } return 0; }
// 반응(평소 대비 판매 배수): 지난 실적의 할인 깊이별 중앙값을 흉내 낸 예시 표 (지금 툴 lift_by_rate 자리)
const LIFT = [[0.1, 1.1], [0.2, 1.4], [0.3, 1.8], [0.4, 2.4], [0.5, 2.9]];
const bucketOf = pct => { const k = LIFT.findIndex(([r]) => pct / 100 <= r); return k < 0 ? LIFT.length - 1 : k; };
const liftOf = pct => pct <= 0 ? 1 : LIFT[bucketOf(pct)][1];
// 예상 매출(참고): 평소 하루 수량 × 반응 × 일수 × 최종가, 범위는 ±25% (지금 툴: 평소 판매 × 요일 × 반응, 하위~상위 25%)
function forecast(it) { const pr = priceOf(it.seq), q = P[it.seq].base * liftOf(pr.pct) * days(it.s, it.e), v = q * pr.fin; return [v * 0.75, v * 1.25]; }

// ================= 묶음(조합) =================
// 지금 툴 engine.recommend_bundles·suggest_partners와 같은 규칙 (예시 데이터로):
// 기준 = 원가가 높아 혼자서는 목표 할인을 못 하는 잘 팔리는 상품 / 짝 = 전체 상품 중 기준보다 싸고, 묶으면 목표 할인이 기준 안에서 되는 상품
// 짝 순서 = 최근 매출 + 다른 카테고리 0.3 + 같은 계열 0.25 − 이미 다른 기준에 추천된 만큼 0.35 / 제안 할인 = 묶음 최대를 5% 단위로 내림, 35% 넘지 않게
const CAT = { P101: '티백', P102: '선물 세트', P104: '선물 세트', P105: '티백', P106: '파우더', P107: '티백', P108: '티백', P109: '선물 세트', P110: '선물 세트' };
const FAMS = ['말차', '벚꽃', '녹차', '허브', '과일', '꽃차', '콜드브루'];
const famOf = name => FAMS.filter(f => name.includes(f));
const floor5 = m => Math.floor(m / 5) * 5;
const salesOf = q => P[q].base * P[q].price;   // 최근 매출 자리 (가상)
const realSeqs = () => Object.keys(P).filter(q => !P[q].combo);
// 묶음 최대 할인(기준 안): 정가 합·원가 합으로 (지금 툴 max_discount와 같은 식)
function comboMax(seqs) { const pr = seqs.reduce((a, q) => a + P[q].price, 0), co = seqs.reduce((a, q) => a + P[q].cost, 0); return Math.max(0, Math.floor((1 - co * 1.1 / TARGET / pr) * 100)); }
let bundle = { rate: 25, cat: '', planFirst: true, base: null, calc: [], calcRate: 25 };
function recommend() {
  const T = bundle.rate, inPlan = q => items.some(i => i.seq === q) || pool.some(x => x.seq === q);
  let bases = bundle.base ? [bundle.base] : realSeqs().filter(q => comboMax([q]) < T && (!bundle.cat || CAT[q] === bundle.cat));
  bases.sort((a, b) => (bundle.planFirst ? inPlan(b) - inPlan(a) : 0) || salesOf(b) - salesOf(a));

    const top = Math.max(1, ...parts.map(x => salesOf(x.q)));
    parts.forEach(x => {

    });

let comboN = 0;

    <div class="ps"><h4>지난 행사 성과</h4><div class="tbl-wrap"><table class="t"><thead><tr><th>행사</th><th>유형</th><th class="num">할인</th><th class="num">하루 수량</th><th class="num">평소 대비</th><th class="num">원가율</th></tr></thead>
      <tbody>${dt.past.map(r => `<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td><td class="num">${r[4]}</td><td class="num">${r[5]}</td></tr>`).join('')}</tbody></table></div></div>
    <div class="ps"><h4>할인 반응: 다음엔 몇 %?</h4><p class="cap">지난 행사에서 할인을 깊게 할수록 판매가 늘었지만 ${dt.next}%를 넘으면 늘어나는 폭이 줄었어요 → <b>${dt.next}% 안팎</b>을 권해요 (기준 안 최대 ${m}%)</p></div>
    <div class="ps"><h4>고객 리뷰</h4><ul class="mini"><li>평점 ${dt.rating} · 선물 언급 ${dt.gift}건 · 재구매 언급 ${dt.again}건 <span class="hint">최근 8주</span></li><li>"${esc(dt.review)}"</li></ul></div>
  </div>`;
}
// 지난 행사 할인 기준: 예전 '지난 성과' 레버 보드 + 할인 패턴 (지난 실적 관찰값, 예시)
const LEVERS = [
  ['요일', '특가 없는 날보다 월·수 특가 날 매출이 1.6배', '하루특가는 월·수에 몰아 두면 좋아요'],
  ['할인 깊이', '선물 세트는 25%까지 반응이 크게 늘고 그 뒤로 완만', '세트는 25~30%에서 멈춰도 돼요'],
  ['쉰 기간', '60일 넘게 특가를 쉰 상품은 반응이 1.3배', `이 기획안엔 ${Object.values(P).filter(p => p.days > 60).length}개가 60일 넘게 쉬었어요`],
  ['하루 품목 수', '하루 3~4개일 때 품목당 매출이 가장 높음', `지금 하루 ${slotsPerDay}자리예요`],
  ['상시 길이', '상시 할인 2주를 넘기면 둘째 주 매출이 떨어짐', '기획안 기간 2주 · 괜찮아요'],
  ['계절', '3월 매출 지수 1.15 (연평균 = 1)', '봄 수요가 받쳐 주는 달이에요'],
];
const PATTERN = [['상시 · 1만원대', '10%', '15%', '20%', '30%'], ['상시 · 2만원대', '15%', '20%', '25%', '35%'], ['상시 · 3만원 이상', '15%', '20%', '28%', '33%'], ['하루특가 · 전체', '30%', '35%', '40%', '50%']];
function leversDrawer() {
  return `<div class="dh"><div class="grow"><div class="overline">지난 행사 할인 기준</div><h2 id="drH">언제, 얼마나, 몇 개를 할인했을 때 잘 팔렸나</h2><span class="cap">요일 · 할인 깊이 · 쉰 기간 · 하루 품목 수 · 상시 길이 · 계절, 그리고 유형·가격대별 할인율이에요. 지난 행사 실적에서 본 값(예시)이고 약속은 아니에요</span></div><button class="btn sm" data-close>닫기</button></div>
  <div class="db">
    <div class="lvb">${LEVERS.map(([k, obs, say]) => `<div><b>${k}</b><span class="cap">${esc(obs)}</span><span class="say">${esc(say)}</span></div>`).join('')}</div>
    <div class="ps"><h4>유형 × 가격대별 할인율 <span class="hint">지난 행사 분포</span></h4><div class="tbl-wrap"><table class="t"><thead><tr><th>유형 · 가격대</th><th class="num">하위 25%</th><th class="num">중앙</th><th class="num">상위 25%</th><th class="num">최대</th></tr></thead>
      <tbody>${PATTERN.map(r => `<tr><td>${r[0]}</td>${r.slice(1).map(c => `<td class="num">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
    <p class="hint">회차별 성과·작년 행사 다시 쓰기는 홈의 '지난 기획안'에서, 계획 대비 실적은 나중에 붙여요.</p>
  </div>`;
}
function renderDrawer() {
  const el = $('#drawer'); el.hidden = $('#scrim').hidden = !drawer;
  if (!drawer) return;
  el.innerHTML = drawer.kind === 'levers' ? leversDrawer() : productDrawer(drawer.seq);
  el.querySelectorAll('.spark i[data-h]').forEach(i => i.style.setProperty('--h', `${Math.max(4, +i.dataset.h)}%`));
}
function putFromDetail(seq, role, r) {
  const it = itemOf(seq);
  if (role === 'item' || role === 'none') {
    if (!it) items.push({ seq, type: role === 'item' ? '상시' : '할인 없음', rate: role === 'item' ? r / 100 : 0, s: PERIOD[0], e: PERIOD[1], appeal: '', clear: false, where: [] });
    else if (role === 'item') { if (r / 100 === it.rate) delete drafts[seq]; else drafts[seq] = r / 100; }
    else { it.type = '할인 없음'; it.rate = 0; delete drafts[seq]; }
  }
  if (role === 'pool') { if (!it && !pool.some(x => x.seq === seq)) pool.push({ seq, src: '상품 상세' }); }
  else pool = pool.filter(x => x.seq !== seq);
  closeDrawer(); render();
  toast({ item: it ? `${r}%로 바꿈에 넣었어요. [반영]을 눌러야 들어가요` : `${r}%로 할인 상품에 넣었어요`, deal: '하루특가 후보로 넣었어요. 하루특가 탭의 [채우기]에서 먼저 보여요', none: '할인 없이 넣었어요', pool: it ? '이미 이 기획안에 있어요' : '후보 상품에 넣었어요' }[role]);
}
function openDrawer(d) { drawer = d; renderDrawer(); $('#drawer [data-close]')?.focus(); }
function closeDrawer() { drawer = null; renderDrawer(); }
function render() {
  renderSum();
  $('#body').innerHTML = ({ items: itemsTab, deals: dealsTab, extras: extrasTab, bundle: bundleTab, pool: poolTab })[tab]();
  // 막대 길이·자리 수는 CSSOM으로 (인라인 style 속성 없이, CSP와 같은 조건)
  document.querySelectorAll('.bar i[data-w]').forEach(el => { el.style.width = `${Math.min(100, el.dataset.w / 3 * 100)}%`; });
  document.querySelectorAll('.slots[data-n]').forEach(el => el.style.setProperty('--n', el.dataset.n));
}

// ================= 동작 =================
// 한 번에 낮추기 (지금 툴과 같음): 원가율 기준을 넘는 행을 기준 안 가장 깊은 할인(5% 단위 내림)으로. 재고 털이·5% 미만이면 빼요. 바로 반영하지 않고 '바꿈'으로 모음
const fixable = () => items.filter(i => i.type !== '할인 없음' && !i.clear && judge(i.seq).lv === 'warn' && floor5(maxRate(i.seq)) >= 5);
const parsePeriod = (txt, s0, e0) => { const m = txt.match(/^(\d{1,2})\/(\d{1,2})~(\d{1,2})\/(\d{1,2})$/); if (!m) return null; const f = (a, b) => `2026-${String(a).padStart(2, '0')}-${String(b).padStart(2, '0')}`; const s = f(m[1], m[2]), e = f(m[3], m[4]); return s <= e ? [s, e] : null; };
document.addEventListener('click', e => {
  const t = e.target, d = k => t.closest(`[data-${k}]`), v = k => d(k)?.dataset[k];
  if (d('pd')) { openDrawer({ kind: 'product', seq: v('pd') }); return; }
  if (d('levers')) { openDrawer({ kind: 'levers' }); return; }
  if (d('close') || t.id === 'scrim') { closeDrawer(); return; }
  if (d('put')) { const [q, role, r] = v('put').split('|'); putFromDetail(q, role, +r); return; }
  if (d('tab')) { tab = v('tab'); render(); document.querySelector(`[data-tab="${tab}"]`)?.focus(); return; }
  if (d('toast')) { toast(v('toast')); return; }
  if (d('where')) { where = v('where'); render(); return; }
  if (d('bulk')) { const f = fixable(); f.forEach(i => { drafts[i.seq] = floor5(maxRate(i.seq)) / 100; }); render(); toast(`${f.length}개를 기준 안으로 낮췄어요. [반영]을 눌러야 들어가요`); return; }
  if (d('lower')) { const q = v('lower'); drafts[q] = floor5(maxRate(q)) / 100; render(); toast(`${floor5(maxRate(q))}%로 낮췄어요. [반영]을 눌러야 들어가요`); return; }
  if (d('pair')) { bundle.base = v('pair'); tab = 'bundle'; drawer = null; renderDrawer(); render(); return; }
  if (d('bn') !== null && t.closest('[data-bn]')) { bundle.base = v('bn') || null; render(); return; }
  if (d('bpick')) { const [b, q, r] = v('bpick').split('|'); addCombo([b, q], +r); return; }
  if (d('bcalc')) { const [b, q, r] = v('bcalc').split('|'); bundle.calc = [b, q]; bundle.calcRate = +r; render(); document.getElementById('calcBox')?.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  if (d('calcadd')) { const q = $('#calcSel')?.value; if (q) { bundle.calc.push(q); render(); } return; }
  if (d('calcrm')) { bundle.calc.splice(+v('calcrm'), 1); render(); return; }
  if (d('calcput')) { if (bundle.calc.length >= 2) { const c = [...bundle.calc]; bundle.calc = []; addCombo(c, bundle.calcRate); } return; }
  const row = t.closest('tr[data-row]'); if (row && !t.closest('input')) { sel = row.dataset.row; render(); return; }
  if (d('apply')) { Object.entries(drafts).forEach(([q, r]) => { itemOf(q).rate = r; }); const n = Object.keys(drafts).length; drafts = {}; render(); toast(`할인 ${n}건을 반영했어요. 구좌 편집에도 같은 값이에요`); return; }
  if (d('undo')) { drafts = {}; render(); return; }
  if (d('fill')) { fillDay = v('fill') || null; render(); return; }   // 빈 값(닫기)이면 후보 목록을 닫음
  if (d('dealadd')) { const [dd, q, r] = v('dealadd').split('|'); (deals[dd] ||= []).push([q, +r / 100]); fillDay = null; render(); toast(`${md(dd)} 하루특가에 ${P[q].name}을 넣었어요`); return; }
  if (d('dealrm')) { const [dd, k] = v('dealrm').split('|'); deals[dd].splice(+k, 1); render(); return; }
  if (d('xseq')) { const [id, q] = v('xseq').split('|'), x = extras.find(y => y.id === id); x.seqs = x.seqs.includes(q) ? x.seqs.filter(y => y !== q) : x.seqs.concat(q); render(); return; }
  if (d('xadd')) { extras.push({ id: `x${extras.length + 1}${Date.now() % 1000}`, name: '쿠폰', calc: 'sale_pct', val: 10, seqs: [], s: PERIOD[0], e: PERIOD[1] }); render(); return; }
  if (d('xdel')) { extras = extras.filter(x => x.id !== v('xdel')); render(); return; }
  if (d('role')) { const [k, r] = v('role').split('|'), x = pool[+k];
    if (r === 'item' || r === 'none') { if (!itemOf(x.seq)) items.push({ seq: x.seq, type: r === 'item' ? '상시' : '할인 없음', rate: r === 'item' ? Math.min(20, maxRate(x.seq)) / 100 : 0, s: PERIOD[0], e: PERIOD[1], appeal: '', clear: false, where: [] }); }
    pool.splice(+k, 1); render(); toast(r === 'drop' ? '후보에서 뺐어요' : r === 'deal' ? '하루특가 후보로 옮겼어요. 하루특가 탭의 [채우기]에서 먼저 보여요' : '할인 상품으로 옮겼어요. 구좌 편집에서 카드에 넣을 수 있어요'); return; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer) closeDrawer(); });
document.addEventListener('keydown', e => { const row = e.target.closest?.('tr[data-row]'); if (row && (e.key === 'Enter' || e.key === ' ') && e.target === row) { e.preventDefault(); sel = row.dataset.row; render(); document.querySelector(`tr[data-row="${sel}"]`)?.focus(); } });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.sim) { drawer.sim = +t.value; renderDrawer(); $('#drawer [data-sim]')?.focus(); return; }
  if (t.dataset.rate) { const q = t.dataset.rate, r = Math.min(90, Math.max(0, Math.round(+t.value || 0))) / 100; if (r === itemOf(q).rate) delete drafts[q]; else drafts[q] = r; sel = q; render(); document.querySelector(`[data-rate="${q}"]`)?.focus(); return; }
  if (t.matches('[data-onlywarn]')) { onlyWarn = t.checked; render(); return; }
  if (t.matches('[data-slots]')) { slotsPerDay = +t.value; render(); return; }
  if (t.dataset.bset) { bundle[t.dataset.bset] = t.dataset.bset === 'rate' ? +t.value : t.value; render(); return; }
  if (t.matches('[data-bplan]')) { bundle.planFirst = t.checked; render(); return; }
  if (t.id === 'calcRate') { bundle.calcRate = Math.min(80, Math.max(0, Math.round(+t.value || 0))); render(); document.getElementById('calcRate')?.focus(); return; }
  if (t.dataset.clear) { itemOf(t.dataset.clear).clear = t.checked; return; }
  if (t.dataset.period) { const it = itemOf(t.dataset.period), pp = parsePeriod(t.value.trim()); if (!pp) { toast('기간은 3/2~3/8처럼 적어 주세요'); render(); return; } [it.s, it.e] = pp; render(); return; }
  if (t.dataset.xf) { const [id, f] = t.dataset.xf.split('|'), x = extras.find(y => y.id === id);
    if (f === 'period') { const pp = parsePeriod(t.value.trim()); if (!pp) { toast('기간은 3/2~3/8처럼 적어 주세요'); render(); return; } [x.s, x.e] = pp; }
    else x[f] = f === 'val' ? Math.max(0, +t.value || 0) : t.value; render(); return; }
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset.appeal) { itemOf(t.dataset.appeal).appeal = t.value; } });
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 2800); }
render();
</script>
</body>
</html>
